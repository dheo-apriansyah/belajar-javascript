<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Function Generator</title>
</head>
<body>
   <script>
      function* buatID(){
         let id = 1;
         while(true){
            yield id++;
         }
      }
       const generate = buatID();
       console.log(generate.next().value);
       console.log(generate.next().value);
   </script>
</body>
</html>
