<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Function sebagai value</title>
</head>
<body>
   <script>
      function sayHello(name){
         document.writeln(`Hello ${name}`);
      }
      sayHello('Fellan'); // untuk memanggil function

      const say = sayHello; // function di dalam variable
      say('dheo');

      function giveName(callback){
         callback(`<p>Apriansyah</p>`);
      }

      giveName(sayHello);
      giveName(say);
   </script>
</body>
</html>
