<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Rest parameter</title>
</head>
<body>
   <script>
      function sum(name, ...data) {
         let total = 0;
         for(const item of data){
            total += item;
         }
         document.writeln(`<p>Total ${name} adalah ${total}</p>`);
      }

      sum("Jeruk", 10, 20, 30, 4432);
      sum("Apel", 5, 10, 79, 432);
      sum("Semangka", 30, 50, 30);

   </script>
</body>
</html>
