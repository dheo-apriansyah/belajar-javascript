<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Super-Method</title>
</head>
<body>
   <script>
      class Hero{
         serang(){
            console.log('Serang')
         }
      }

      class Mage extends Hero{
         serang(){
            console.log("Serang Initiator");
         }
      }

      const sage = new Mage();
      sage.serang();
   </script>
</body>
</html>
