<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Property class</title>
</head>
<body>
   <script>
      class Hero{
         constructor(name){
            this.name = name;

         }
      }

      const mage = new Hero('Edora');
      console.info(mage);
   </script>
</body>
</html>
